name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # No Alpaca credentials or DATABASE_URL needed: tests/conftest.py sets
      # dummy Alpaca creds itself, and every database.py function is a
      # documented no-op when DATABASE_URL is unset.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Same keyless scope as the live cron: the Donchian strategy, its
      # operational shell, the paper-forward ledger, and the signal research.
      # The Grok Apex ML/dense-suite is NOT run (that bot is disabled).
      - name: Run tests
        run: >
          pytest -v
          tests/test_donchian_breakout.py
          tests/test_donchian_bot.py
          tests/test_donchian_forward.py
          tests/test_xsec_momentum.py
